name: Build Android APK & AAB (FarshBazaar)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and AAB for Myket & Direct Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies and Build Web Assets
        run: |
          npm ci || npm install
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          rm -f android/app/src/main/assets/server.cjs* || true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Android App Bundle (AAB for Myket and Cafe Bazaar)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace || gradle bundleRelease --stacktrace

      - name: Build Android APK (Direct Install for Users)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace

      - name: Upload AAB Package (for Myket / Bazaar upload)
        uses: actions/upload-artifact@v4
        with:
          name: FarshBazaar-Myket-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Direct Install APK (for Phones and Tablets)
        uses: actions/upload-artifact@v4
        with:
          name: FarshBazaar-DirectInstall-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
