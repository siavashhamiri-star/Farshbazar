name: Build Android APK & AAB for Myket and Bazaar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle
        run: |
          cd android
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build Android App Bundle (AAB) for Myket / Google Play
        run: |
          cd android
          gradle bundleRelease --stacktrace || ./gradlew bundleRelease --stacktrace

      - name: Build Android APK for Direct Download / Bazaar / Myket
        run: |
          cd android
          gradle assembleRelease --stacktrace || ./gradlew assembleRelease --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarshBazaar-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarshBazaar-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
