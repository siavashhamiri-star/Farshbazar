name: Build Farshbazar APK AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Verify build environment
        run: |
          echo "Java:"
          java -version
          echo "Gradle:"
          which gradle
          gradle --version
          echo "Android SDK:"
          echo "$ANDROID_HOME"

      - name: Fix launcher resources
        working-directory: android/app/src/main
        run: |
          mkdir -p res/drawable

          cat > res/drawable/ic_launcher_fallback.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#8B5E3C"/>
              <corners android:radius="16dp"/>
          </shape>
          EOF

          sed -i 's/@mipmap\/ic_launcher_round/@drawable\/ic_launcher_fallback/g' AndroidManifest.xml
          sed -i 's/@mipmap\/ic_launcher/@drawable\/ic_launcher_fallback/g' AndroidManifest.xml
          sed -i 's/ package="ir\.farshbazaar\.app"//' AndroidManifest.xml

          echo "Launcher resources fixed."

      - name: Clean Android project
        working-directory: android
        run: |
          gradle clean --stacktrace

      - name: Build Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Build Release AAB
        working-directory: android
        run: |
          gradle bundleRelease --stacktrace

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/release/

      - name: Verify AAB
        run: |
          ls -lh android/app/build/outputs/bundle/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Farshbazar-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Farshbazar-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
